name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  api-checks:
    name: API Lint, Build & Unit Tests
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aemade_selam_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Generate Prisma Client
        working-directory: api
        run: npx prisma generate

      - name: Run API Lint
        working-directory: api
        run: npm run lint

      - name: Run API Build
        working-directory: api
        run: npm run build

      - name: Run API Unit Tests & Coverage
        working-directory: api
        run: npm run test:cov

  web-checks:
    name: Web Lint, Build & Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Run Web Lint
        working-directory: web
        run: npm run lint

      - name: Run Web Build
        working-directory: web
        run: npm run build

      - name: Install Playwright Browsers
        working-directory: web
        run: npx playwright install --with-deps msedge chromium

      - name: Run Playwright E2E Tests
        working-directory: web
        run: npx playwright test tests/e2e-main-journeys.spec.ts
        env:
          CI: true

  deploy:
    name: Build Multi-stage Images & Deploy over SSH
    runs-on: ubuntu-latest
    needs: [api-checks, web-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT || 22 }}
          script: |
            set -e
            cd /opt/aemade-selam
            echo "Pulling latest production images..."
            docker compose -f docker-compose.prod.yml pull
            echo "Executing zero-downtime rolling restart..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            echo "Pruning unused dangling images..."
            docker image prune -f
            echo "Deployment completed successfully!"
